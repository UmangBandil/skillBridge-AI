version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillbridge}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-api
    restart: unless-stopped
    ports:
      - '10000:10000'
    environment:
      NODE_ENV: production
      PORT: 10000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skillbridge}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key-minimum-32-chars!}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      CLIENT_URL: http://localhost:10000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 500
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:10000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
