name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillbridge_test?schema=public
        run: |
          cd server
          npx prisma migrate deploy

      - name: Run Server Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillbridge_test?schema=public
          JWT_SECRET: ci-super-secret-jwt-key-minimum-32-chars-long!
          NODE_ENV: test
        run: npm test -w server

      - name: Run Frontend Tests
        run: npm test -w web

      - name: Build Web Application
        run: npm run build -w web

  docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skillbridge-api:latest
